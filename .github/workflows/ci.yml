name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # traci / sumolib 属于 SUMO 运行时依赖，需完整安装 Eclipse SUMO，
          # 故不在 CI 环境安装：代码对二者做了惰性导入与优雅降级，单元测试无需真实 SUMO 进程。
          pip install numpy "pydantic>=2.7.0" "fastapi>=0.110.0" "httpx>=0.27.0"

      - name: Compile check
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  lint-imports:
    name: Import sanity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify agent imports without SUMO present
        run: |
          python -m pip install --upgrade pip
          pip install numpy "pydantic>=2.7.0"
          python -c "from src.agents.traffic_agent import TrafficDecisionAgent; a = TrafficDecisionAgent(); print('agent import OK'); print(a.llm.describe())"
