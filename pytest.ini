[pytest]
testpaths = tests
# `pytest` 默认只跑「快速回归」：tests/test_*.py 中的核心单元与接口用例（113 项）。
#
# 为什么不把 E2E 一起跑：
# tests/e2e/ 是 Playwright 浏览器端到端用例，属于重量级测试——它需要先执行
# `playwright install`、会拉起真实 Chromium 与一个隔离的 FastAPI 服务，单轮耗时数分钟。
# 更关键的是，在本机沙箱环境下 Chromium 的 `browser.close()` 浏览器回收会阻塞进程退出
# （用例本身全部通过，只是 pytest 进程不返回），把它塞进默认 `pytest` 会让一次普通的
# 回归测试变成"跑完卡死"。
#
# 需要跑 E2E 时请显式指定：
#     pytest -m e2e            （命令行 -m 覆盖本文件里的默认排除）
#     python scripts/run_e2e.py
addopts = -m "not e2e" -p no:cacheprovider

markers =
    e2e: 浏览器端到端（Playwright）用例，默认不参与快速回归
